<!DOCTYPE html>
<html lang="en" data-root="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>(function(){try{var t=localStorage.getItem('theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <title>Contact — Emin Erkan YILDIRIM</title>
  <meta name="description" content="Get in touch — email, GitHub, LinkedIn." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="contact">
  <header class="site-header" data-header></header>

  <main>
    <section class="wrap page-head">
      <p class="eyebrow prompt mono-label">./contact --now</p>
      <h1>Get in touch</h1>
      <p class="lede">Open to engineering roles and interesting hardware/software problems. The fastest way to reach me is email.</p>
    </section>

    <section class="wrap" style="padding-top:0">
      <ul class="contact-lines" data-contact></ul>
    </section>
  </main>

  <footer class="site-footer" data-footer></footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    // Contact rows are built here so links stay tied to SITE in data.js.
    document.addEventListener("DOMContentLoaded", () => {
      const mount = document.querySelector("[data-contact]");
      if (!mount) return;
      const rows = [
        { k: "email", v: SITE.email, href: "mailto:" + SITE.email },
        { k: "github", v: SITE.github.replace(/^https?:\/\//, ""), href: SITE.github },
        { k: "linkedin", v: SITE.linkedin.replace(/^https?:\/\//, ""), href: SITE.linkedin },
        { k: "location", v: SITE.location, href: null },
      ];
      mount.innerHTML = rows.map((r) => `
        <li>
          <span class="k">${r.k}</span>
          ${r.href
            ? `<a class="v" href="${r.href}"${r.href.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}>${r.v}</a>`
            : `<span class="v">${r.v}</span>`}
        </li>`).join("");
    });
  </script>
</body>
</html>
