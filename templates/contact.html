<!DOCTYPE html>
<html lang="en" data-root="{{root}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {{theme}}
  <title>Contact — Emin Erkan YILDIRIM</title>
  <meta name="description" content="Get in touch — email, GitHub, LinkedIn." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{root}}assets/css/style.css" />
</head>
<body data-page="contact">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header" data-header>{{header}}</header>

  <main id="main-content" tabindex="-1">
    <section class="wrap page-head">
      <p class="eyebrow prompt mono-label">./contact --now</p>
      <h1>Get in touch</h1>
      <p class="lede">Open to engineering roles and interesting hardware/software problems. The fastest way to reach me is email.</p>
    </section>

    <section class="wrap" style="padding-top:0">
      <ul class="contact-lines" data-contact>{{contact}}</ul>
      <div class="btn-row" style="margin-top:1.5rem"><button type="button" class="btn copy-email" data-copy-email="{{email}}" hidden>Copy email address</button></div>
      <p class="copy-status" role="status" aria-live="polite" data-copy-status></p>
    </section>
  </main>

  <footer class="site-footer" data-footer>{{footer}}</footer>
  <script src="{{root}}assets/js/main.js"></script>
</body>
</html>
